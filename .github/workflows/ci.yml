name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: no job needs more than read access to the repo.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scan every commit, not only the tip of the branch.
          fetch-depth: 0

      - name: Detect leaked credentials
        # GITLEAKS_LICENSE is only required for Organization-owned repositories.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # npmjs registry is used because the mirror configured locally lacks the
      # advisories endpoint; fail on high-severity only (moderates are
      # transitive noise). Kept as its own gate before typecheck.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high --registry=https://registry.npmjs.org

      - name: Assert env files are not tracked
        run: |
          if git ls-files --error-unmatch .env .env.local apps/web/.env.local >/dev/null 2>&1; then
            echo "::error::A real .env file is tracked in this repository."
            exit 1
          fi

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Lint
        run: pnpm -r --if-present lint

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Format check
        run: pnpm format:check

      - name: Production build
        run: pnpm build
        env:
          # Build-time placeholders only. No secret is required to compile, and
          # none of these values reach a browser bundle as anything but a URL.
          NEXT_PUBLIC_SITE_URL: https://starstask.example

  integration:
    name: Migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify

    env:
      # Local-only placeholders required by supabase/config.toml.
      SUPABASE_AUTH_GOOGLE_CLIENT_ID: test-client-id
      SUPABASE_AUTH_GOOGLE_SECRET: test-client-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Start local Supabase
        # Unneeded services increase startup time and CI flakiness.
        run: supabase start --exclude studio,imgproxy,logflare,vector,mailpit,realtime,edge-runtime,postgres-meta

      - name: Apply migrations to an empty database
        run: supabase db reset --local --yes

      - name: Regenerate database types
        run: pnpm db:types

      - name: Check database types are current
        run: git diff --exit-code -- apps/web/src/types/database.generated.ts

      - name: Export disposable test credentials
        run: |
          set -a
          source <(supabase status -o env)
          set +a

          {
            echo "SUPABASE_TEST_URL=$API_URL"
            echo "SUPABASE_TEST_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_TEST_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run integration tests
        run: pnpm --filter @starstask/web test:integration

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: Playwright (public pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @starstask/web exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm --filter @starstask/web test:e2e
        env:
          CI: "true"
          # Tests that need a live Supabase project skip themselves when unset.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
